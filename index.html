<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&family=Reem+Kufi:wght@400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="decor" aria-hidden="true">
  <i class="fc tl"></i><i class="fc tr"></i><i class="fc bl"></i><i class="fc br"></i>
  <i class="dove d1"></i><i class="dove d2"></i>
</div>
<div id="fx" aria-hidden="true"></div>

<section id="intro">
  <button id="seal-btn" class="env" type="button">
    <span class="env-back"></span>
    <span class="env-card"><b id="m1"></b><i id="m-amp"></i><b id="m2"></b></span>
    <span class="env-front"></span>
    <span class="env-flap"></span>
    <span class="env-seal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
  </button>
  <p id="tap-hint"></p>
</section>

<main id="stage" hidden>
  <header class="hero">
    <svg class="emblem" viewBox="0 0 64 88" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="32" cy="44" rx="29" ry="41"/><ellipse cx="32" cy="44" rx="25" ry="37" stroke-width=".7"/><path d="M32 74 Q31 52 34 30"/><path d="M32 66 q-10-4-13-13 q10 0 13 13z M32 58 q9-4 12-12 q-9-1-12 12z M33 48 q-7-3-9-10 q8 0 9 10z"/><circle cx="34" cy="26" r="2.5"/><path d="M34 21 q3-6 8-4 M36 24 q7-1 8 4 M35 29 q5 4 2 8 M31 28 q-6 3-8-2 M31 24 q-5-4-1-8"/></svg>
    <p id="bismillah" class="bism"></p>
    <div class="arch">
      <i class="orb o1">✦</i><i class="orb o2">✦</i>
      <p class="eyebrow ln"><span id="eyebrow"></span></p>
      <h1 class="names">
        <span class="ln"><span id="groom"></span></span>
        <span class="ln amp"><span id="amp"></span></span>
        <span class="ln"><span id="bride"></span></span>
      </h1>
      <p id="message" class="message"></p>
      <div class="daterow">
        <div class="dr-side"><strong id="d-week"></strong></div>
        <div class="dr-mid"><b id="d-day"></b><span id="d-month"></span></div>
        <div class="dr-side"><strong id="time"></strong></div>
      </div>
    </div>
  </header>

  <div class="content">
    <section class="sec" data-r>
      <p id="verse" class="verse"></p>
    </section>

    <section class="sec" data-r>
      <small class="label" id="l-count"></small>
      <div class="count" role="timer" aria-live="off">
        <div><b id="c-d">00</b><small id="l-d"></small></div>
        <div><b id="c-h">00</b><small id="l-h"></small></div>
        <div><b id="c-m">00</b><small id="l-m"></small></div>
        <div><b id="c-s">00</b><small id="l-s"></small></div>
      </div>
    </section>

    <section class="sec venue" data-r>
      <small class="label" id="l-venue"></small>
      <h2 id="venue"></h2>
      <p id="venue-alt" class="venue-alt" dir="ltr"></p>
      <p id="address"></p>
      <a id="map" class="cta" target="_blank" rel="noopener"></a>
      <div id="react-calendar"></div><!-- React: Add to Calendar -->
    </section>

    <section id="notes" class="sec notes" data-r hidden><div class="notes-box"><ul id="notes-list"></ul><p id="notes-note" class="notes-note"></p></div></section>

    <section class="sec" data-r>
      <div id="react-rsvp"></div><!-- React: RSVP -->
    </section>

    <footer class="sec closing" data-r>
      <p id="thanks"></p>
      <p id="sign" class="sign"></p>
      <p id="closedate" class="closedate"></p>
    </footer>
  </div>
</main>

<script src="script.js"></script>
<!-- React add-on (CDN, no build step). Serve over http://, e.g. python -m http.server 8000 -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="text/babel" src="InvitationReact.jsx"></script>
</body>
</html>
